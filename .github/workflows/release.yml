name: Release

# Tag a commit and the release builds itself:
#
#   git tag v1.1.1
#   git push origin v1.1.1
#
# Produces NoSleep-<version>.zip, uploads it as a workflow artifact and, only for a tag, attaches
# the same file to a GitHub Release. A manual run proves the chain but publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release

jobs:
  build:
    runs-on: macos-15

    steps:
      # Un rilascio ad-hoc cambia identità a ogni build e macOS azzera i permessi già concessi.
      # Questo preflight viene prima perfino del checkout: senza la chiave non esiste un fallback
      # accettabile e il runner deve dirlo prima di spendere tempo in una build che non può uscire.
      - name: Signing secrets preflight
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERT_P12" ]]; then
            echo "::error::manca MACOS_CERT_P12: Scripts/make-signing-cert.sh crea l'identità; esportala da Accesso Portachiavi come .p12; base64 -i cert.p12 | pbcopy; incolla il risultato nel secret del repository"
            exit 1
          fi
          if [[ -z "$MACOS_CERT_PASSWORD" ]]; then
            echo "::error::manca MACOS_CERT_PASSWORD: salva nel secret del repository la password usata per esportare il .p12"
            exit 1
          fi

      - uses: actions/checkout@v4

      # `build-app.sh` controlla con bun che `Horse.swift` corrisponda ancora alle maschere in
      # `Scripts/cavallo/`. Un runner GitHub non ha bun, e senza questo passo la corsa muore con
      # `bun: command not found` (misurato: corsa 33280152884 del 2026-08-29).
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `horse-frames.ts --check` legge le maschere PNG con ImageMagick. Il runner non ce l'ha, e
      # senza questo passo la corsa muore in `leggiMaschera` (misurato: corsa 33280233175). Il
      # controllo NON si salta: è quello che impedisce a `Horse.swift` di divergere dalle pose.
      - name: Install ImageMagick
        run: brew install imagemagick

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # The tests are the gate, not a formality: nothing gets built for release before they pass.
      - name: Run tests
        run: swift test

      # `-T` da solo non basta: senza la partition list il primo codesign aspetta una finestra di
      # Portachiavi invisibile sul runner. È un blocco già pagato, non una cautela teorica.
      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/nosleep-signing.keychain-db"
          KEYCHAIN_PASSWORD="nosleep-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          P12="$RUNNER_TEMP/nosleep-signing.p12"
          CERT="$RUNNER_TEMP/nosleep-signing.pem"

          printf '%s' "$MACOS_CERT_P12" | base64 -D > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING_KEYCHAINS=()
          while IFS= read -r existing; do
            EXISTING_KEYCHAINS+=("$existing")
          done < <(security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING_KEYCHAINS[@]}"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -A -T /usr/bin/codesign
          # Un certificato autofirmato importato non è ancora *fidato*, e `find-identity -v` scarta
          # le identità non fidate: senza questa riga la firma non troverebbe «NoSleep Dev» e
          # build-app.sh uscirebbe 6. La fiducia si scrive nel dominio di amministrazione con
          # `sudo`, non in quello dell'utente: la forma utente apre una finestra di autorizzazione
          # che su un runner senza schermo nessuno può chiudere.
          security find-certificate -c "NoSleep Dev" -p "$KEYCHAIN" > "$CERT"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CERT"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "NoSleep Dev" \
            || { echo "::error::il .p12 non contiene l'identità di firma NoSleep Dev"; exit 1; }

      - name: Build NoSleep.app and its release zip
        env:
          NOSLEEP_SKIP_INSTALL: "1"    # a CI runner has no /Applications to own
          NOSLEEP_RELEASE: "1"         # ad-hoc is forbidden and the zip verifies its own signature
          # Solo icone e cavallo sono provati sul runner; gli altri banchi chiedono hardware reale.
          # Questa variabile sparisce appena una corsa verde dimostra che il runner li sopporta.
          NOSLEEP_PURE_BENCHES: "1"
        run: |
          # On a tag, the tag IS the version — the app must not be free to say something else.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export NOSLEEP_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./Scripts/build-app.sh "$PWD/dist"

      # Volutamente ridondante col cancello dentro build-app.sh: questa chiamata resta onesta anche
      # se un domani qualcuno aggiunge al build un percorso che salta il controllo interno. La
      # logica resta una sola, nello script, così i due chiamanti non possono divergere.
      - name: Verify no build paths escaped
        run: |
          if ! bash Scripts/check-paths.sh "$PWD/dist/NoSleep.app" "$PWD"; then
            echo "::error::il bundle rivela il percorso assoluto della macchina che lo ha costruito"
            exit 1
          fi

      # A signed directory can still be incomplete. Each missing promise gets its own error so a
      # red release says which contract broke instead of asking somebody to infer it from `test`.
      # `Authority=<Nome> Dev` è un controllo sul NOME, e un altro certificato autofirmato con lo
      # stesso Common Name lo supererebbe: macOS non guarda la stringa, guarda il designated
      # requirement, e un'identità diversa azzera i permessi TCC già concessi (Accessibilità,
      # microfono). Qui l'impronta della foglia è fissata a quella dell'identità vera, letta
      # dall'app firmata. Rilievo dell'audit cross-vendor del 2026-08-30; due poli misurati:
      # exit 0 contro la propria identità, exit 3 contro un'impronta diversa.
      - name: Pin the signing identity
        run: |
          APP="dist/NoSleep.app"
          REQ='identifier "app.nosleep.mac" and certificate leaf = H"d93387f7f9a8592bb960bd0177c03a31c9c59e2f"'
          codesign --verify --strict -R="$REQ" "$APP" \
            || { echo "::error::il bundle non soddisfa il designated requirement fissato: un certificato diverso azzererebbe i permessi gia concessi"; exit 1; }

      # La logica del tasto nei sorgenti non prova che il binario SPEDITO lo esponga: fino al
      # 2026-08-30 le tre release pubblicate non lo contenevano, e nessun cancello lo diceva.
      - name: The published binary carries the update button
        run: |
          strings "dist/NoSleep.app/Contents/MacOS/NoSleep" | grep -qF 'Check for updates' \
            || { echo "::error::il binario non contiene il tasto di aggiornamento"; exit 1; }

      - name: Verify the bundle
        run: |
          APP="$PWD/dist/NoSleep.app"
          test -x "$APP/Contents/MacOS/NoSleep" \
            || { echo "::error::manca l'eseguibile Contents/MacOS/NoSleep"; exit 1; }
          test -x "$APP/Contents/MacOS/nosleep-cli" \
            || { echo "::error::manca l'eseguibile Contents/MacOS/nosleep-cli"; exit 1; }
          test -x "$APP/Contents/MacOS/nosleep-helper" \
            || { echo "::error::manca l'eseguibile Contents/MacOS/nosleep-helper"; exit 1; }
          test -f "$APP/Contents/Resources/NoSleep.icns" \
            || { echo "::error::manca Contents/Resources/NoSleep.icns"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP" \
            || { echo "::error::la firma del bundle non supera codesign --verify"; exit 1; }

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$APP/Contents/Info.plist")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            EXPECTED="${GITHUB_REF_NAME#v}"
            [[ "$VERSION" == "$EXPECTED" ]] \
              || { echo "::error::il tag dice ${EXPECTED}, il bundle dichiara ${VERSION}"; exit 1; }
          fi
          ASSET="$PWD/dist/NoSleep-${VERSION}.zip"
          test -f "$ASSET" \
            || { echo "::error::build-app.sh non ha prodotto NoSleep-${VERSION}.zip"; exit 1; }
          echo "NOSLEEP_BUNDLE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NOSLEEP_ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoSleep-${{ env.NOSLEEP_BUNDLE_VERSION }}
          path: ${{ env.NOSLEEP_ASSET }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.NOSLEEP_ASSET }}
          generate_release_notes: true

      # Il portachiavi contiene la chiave privata del rilascio: si elimina anche quando un cancello
      # precedente va rosso, non soltanto nel percorso felice.
      - name: Delete temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/nosleep-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/nosleep-signing.p12" "$RUNNER_TEMP/nosleep-signing.pem"
